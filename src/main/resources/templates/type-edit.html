<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Cập nhật Danh Mục</title>
    <style>
        body { background-color: #f4f7f6; font-family: 'Segoe UI', Arial, sans-serif; }
        .container {
            max-width: 500px;
            margin: 50px auto;
            background: #fff;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
        }
        h2 {
            color: #2c3e50;
            text-align: center;
            margin-bottom: 25px;
            font-weight: 600;
        }
        .form-group { margin-bottom: 20px; }
        label {
            display: block;
            font-weight: bold;
            margin-bottom: 8px;
            color: #555;
        }
        input[type="text"] {
            width: 100%;
            padding: 12px;
            border: 2px solid #eee;
            border-radius: 8px;
            box-sizing: border-box;
            transition: border-color 0.3s;
        }
        input[type="text"]:focus {
            border-color: #28a745;
            outline: none;
        }
        .btn-save {
            background: linear-gradient(135deg, #28a745 0%, #218838 100%);
            color: white;
            padding: 14px;
            border: none;
            cursor: pointer;
            border-radius: 8px;
            font-weight: bold;
            width: 100%;
            font-size: 16px;
            transition: transform 0.2s, box-shadow 0.2s;
        }
        .btn-save:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(40, 167, 69, 0.3);
        }
        .back-link {
            display: block;
            text-align: center;
            margin-top: 20px;
            color: #666;
            text-decoration: none;
            font-size: 14px;
        }
        .back-link:hover { color: #333; text-decoration: underline; }
    </style>
</head>
<body>

<div class="container">
    <h2>📂 Thêm Loại Sản Phẩm</h2>
    <hr style="border: 0; border-top: 1px solid #eee; margin-bottom: 25px;">

    <form th:action="@{/product-types/save}" th:object="${productType}" method="post">
        <input type="hidden" th:field="*{id}" />

        <div class="container">
            <h2 th:text="${pageTitle} ?: '📂 Thêm Loại Sản Phẩm'"></h2>
            <hr>

            <div class="form-group">
                <label>Tên danh mục:</label>
                <input type="text" th:field="*{typeName}" required class="form-control" />
                <p style="color: red;" th:if="${#fields.hasErrors('typeName')}" th:errors="*{typeName}"></p>
            </div>

            <div class="form-group">
                <label>Trạng thái:</label>
                <select th:field="*{isActive}" class="form-control">
                    <option value="1">✅ Đang hoạt động</option>
                    <option value="0">❌ Tạm khóa</option>
                    <option value="2">➕ Khác</option>
                </select>
            </div>

            <button type="submit" class="btn-save">✨ CẬP NHẬT DANH MỤC</button>
        </div>
    </form>

    <a th:href="@{/product-types}" class="back-link">⬅ Quay lại danh sách</a>
</div>

</body>
</html>
