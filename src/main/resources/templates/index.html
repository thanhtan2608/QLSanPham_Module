<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Danh sách sản phẩm</title>
    <style>
        table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        th, td { border: 1px solid #ddd; padding: 12px; text-align: left; }
        th { background-color: #f4f4f4; }
        .btn { padding: 5px 10px; text-decoration: none; border-radius: 4px; }
        .btn-add { background-color: #28a745; color: white; }
        .btn-edit { background-color: #ffc107; color: black; }
        .btn-delete { background-color: #dc3545; color: white; }
    </style>
</head>
<body>
<style>
    /* CSS cho Thanh Menu */
    .navbar {
        background-color: #333;
        overflow: hidden;
        font-family: Arial, sans-serif;
        border-radius: 4px;
    }
    .navbar a {
        float: left;
        display: block;
        color: white;
        text-align: center;
        padding: 14px 20px;
        text-decoration: none;
    }
    .navbar a:hover {
        background-color: #ddd;
        color: black;
    }
    /* Menu thả xuống (Dropdown) */
    .dropdown {
        float: left;
        overflow: hidden;
    }
    .dropdown .dropbtn {
        font-size: 16px;
        border: none;
        outline: none;
        color: white;
        padding: 14px 20px;
        background-color: inherit;
        font-family: inherit;
        margin: 0;
    }
    .dropdown-content {
        display: none;
        position: absolute;
        background-color: #f9f9f9;
        min-width: 160px;
        box-shadow: 0px 8px 16px 0px rgba(0,0,0,0.2);
        z-index: 1;
    }
    .dropdown-content a {
        float: none;
        color: black;
        padding: 12px 16px;
        text-decoration: none;
        display: block;
        text-align: left;
    }
    .dropdown-content a:hover { background-color: #ddd; }
    .dropdown:hover .dropdown-content { display: block; }
    .dropdown:hover .dropbtn { background-color: #555; }
</style>

<body>

<div class="navbar">
    <a th:href="@{/products}">Trang chủ</a>

    <div class="dropdown">
        <button class="dropbtn">Sản phẩm ▾</button>
        <div class="dropdown-content">
            <a th:href="@{/products}">Tất cả sản phẩm</a>
            <hr style="margin: 0; border: 0.5px solid #eee;">
            <th:block>
                <a th:href="@{/product-types}"> Danh mục</a>
            </th:block>
        </div>
    </div>
</div>

<div style="padding: 20px;">
    <h2>Quản lý sản phẩm</h2>
    <a th:href="@{/products/new}" class="btn btn-add">Thêm sản phẩm mới</a>
</div>

<table>
    <thead>
    <tr>
        <th>Mã SP</th>
        <th>Hình ảnh</th> <th>Loại</th>
        <th>Tên sản phẩm</th>
        <th>Giá</th>
        <th>Mô tả</th> <th>Ngày tạo</th>
        <th>Ngày cập nhật</th>
        <th>Thao tác</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="p : ${listProducts}">
        <td th:text="${p.productCode}"></td>

        <td>
            <img th:if="${p.imageUrl != null && p.imageUrl != ''}"
                 th:src="@{'/uploads/' + ${p.imageUrl}}"
                 th:alt="${p.name}"
                 style="width: 80px; height: auto; border-radius: 4px; border: 1px solid #ddd;"/>

            <span th:unless="${p.imageUrl != null && p.imageUrl != ''}"
                  style="color: #999; font-style: italic; font-size: 13px;">
        Chưa có hình
    </span>
        </td>

        <td th:text="${p.productType != null ? p.productType.typeName : 'Chưa phân loại'}"></td>
        <td th:text="${p.name}"></td>
        <td th:text="${#numbers.formatDecimal(p.price * 1000, 0, 'COMMA', 0, 'POINT')} + ' VNĐ'"></td>
        <td th:text="${p.description}" style="max-width: 200px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;"></td>

        <td th:text="${#temporals.format(p.createdAt, 'dd-MM-yyyy HH:mm')}"></td>
        <td th:text="${#temporals.format(p.updatedAt, 'dd-MM-yyyy HH:mm')}"></td>

        <td>
            <a th:href="@{/products/edit/{id}(id=${p.id})}" class="btn btn-edit">Sửa</a>
            <a th:href="@{/products/delete/{id}(id=${p.id})}"
               class="btn btn-delete"
               onclick="return confirm('Bạn có chắc chắn muốn xóa sản phẩm này không?')">
                Xóa
            </a>
        </td>
    </tr>
    </tbody>
</table>

</body>
</html>
