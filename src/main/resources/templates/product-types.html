<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Quản lý Loại sản phẩm</title>
    <style>
        table { width: 90%; border-collapse: collapse; margin: 20px auto; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        th, td { border: 1px solid #ddd; padding: 12px; text-align: left; }
        th { background-color: #007bff; color: white; }
        tr:nth-child(even) { background-color: #f2f2f2; }
        .badge { padding: 5px 10px; border-radius: 20px; font-size: 12px; }
        .badge-success { background-color: #28a745; color: white; }
        .badge-danger { background-color: #dc3545; color: white; }
        .container { padding: 20px; max-width: 1200px; margin: auto; }
        .btn { padding: 8px 15px; text-decoration: none; border-radius: 4px; display: inline-block; }
        .btn-primary { background: #007bff; color: white; }
    </style>
</head>
<body>
<style>
    /* CSS cho Thanh Menu */
    .navbar {
        background-color: #333;
        overflow: hidden;
        font-family: Arial, sans-serif;
        border-radius: 4px;
    }
    .navbar a {
        float: left;
        display: block;
        color: white;
        text-align: center;
        padding: 14px 20px;
        text-decoration: none;
    }
    .navbar a:hover {
        background-color: #ddd;
        color: black;
    }
    /* Menu thả xuống (Dropdown) */
    .dropdown {
        float: left;
        overflow: hidden;
    }
    .dropdown .dropbtn {
        font-size: 16px;
        border: none;
        outline: none;
        color: white;
        padding: 14px 20px;
        background-color: inherit;
        font-family: inherit;
        margin: 0;
    }
    .dropdown-content {
        display: none;
        position: absolute;
        background-color: #f9f9f9;
        min-width: 160px;
        box-shadow: 0px 8px 16px 0px rgba(0,0,0,0.2);
        z-index: 1;
    }
    .dropdown-content a {
        float: none;
        color: black;
        padding: 12px 16px;
        text-decoration: none;
        display: block;
        text-align: left;
    }
    .dropdown-content a:hover { background-color: #ddd; }
    .dropdown:hover .dropdown-content { display: block; }
    .dropdown:hover .dropbtn { background-color: #555; }
</style>

<body>

<div class="navbar">
    <a th:href="@{/products}">Trang chủ</a>

    <div class="dropdown">
        <button class="dropbtn">Sản phẩm ▾</button>
        <div class="dropdown-content">
            <a th:href="@{/products}">Tất cả sản phẩm</a>
            <hr style="margin: 0; border: 0.5px solid #eee;">
            <th:block>
                <a th:href="@{/product-types}"> Danh mục</a>
            </th:block>
        </div>
    </div>
</div>

<div style="padding: 20px;">
    <h2>Quản lý loại</h2>
    <a th:href="@{/product-types/new}" class="btn btn-add">Tạo mới</a>
</div>

    <table>
        <thead>
        <tr>
            <th>Tên loại</th>
            <th>Trạng thái</th>
            <th>Hành động</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="pt : ${listProductTypes}">
            <td th:text="${pt.typeName}" style="font-weight: bold;"></td>
            <td>
                <span th:if="${pt.isActive == 1}" class="badge badge-success">Hoạt động</span>
                <span th:if="${pt.isActive != 1}" class="badge badge-danger">Ngưng</span>
            </td>
            <td>
                <a th:href="@{/product-types/edit/{id}(id=${pt.id})}" style="color: #ffc107;">Sửa</a> |
                <a th:href="@{/product-types/delete/{id}(id=${pt.id})}"
                   th:onclick="return confirm('Bạn có chắc muốn xóa loại này?')"
                   style="color: #dc3545;">Xóa</a>
            </td>
        </tr>
        </tbody>
    </table>
</div>

</body>
</html>
