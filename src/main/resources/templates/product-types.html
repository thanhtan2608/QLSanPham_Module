<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Quản lý Loại sản phẩm</title>
    <style>
        table { width: 90%; border-collapse: collapse; margin: 20px auto; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        th, td { border: 1px solid #ddd; padding: 12px; text-align: left; }
        th { background-color: #007bff; color: white; }
        tr:nth-child(even) { background-color: #f2f2f2; }
        .badge { padding: 5px 10px; border-radius: 20px; font-size: 12px; }
        .badge-success { background-color: #28a745; color: white; }
        .badge-danger { background-color: #dc3545; color: white; }
        .container { padding: 20px; max-width: 1200px; margin: auto; }
        .btn { padding: 8px 15px; text-decoration: none; border-radius: 4px; display: inline-block; }
        .btn-primary { background: #007bff; color: white; }
    </style>
</head>
<body>
<style>
    /* CSS cho Thanh Menu */
    .navbar {
        background-color: #333;
        overflow: hidden;
        font-family: Arial, sans-serif;
        border-radius: 4px;
    }
    .navbar a {
        float: left;
        display: block;
        color: white;
        text-align: center;
        padding: 14px 20px;
        text-decoration: none;
    }
    .navbar a:hover {
        background-color: #ddd;
        color: black;
    }
    /* Menu thả xuống (Dropdown) */
    .dropdown {
        float: left;
        overflow: hidden;
    }
    .dropdown .dropbtn {
        font-size: 16px;
        border: none;
        outline: none;
        color: white;
        padding: 14px 20px;
        background-color: inherit;
        font-family: inherit;
        margin: 0;
    }
    .dropdown-content {
        display: none;
        position: absolute;
        background-color: #f9f9f9;
        min-width: 160px;
        box-shadow: 0px 8px 16px 0px rgba(0,0,0,0.2);
        z-index: 1;
    }
    .dropdown-content a {
        float: none;
        color: black;
        padding: 12px 16px;
        text-decoration: none;
        display: block;
        text-align: left;
    }
    .dropdown-content a:hover { background-color: #ddd; }
    .dropdown:hover .dropdown-content { display: block; }
    .dropdown:hover .dropbtn { background-color: #555; }
    .btn-add {
    display: inline-block;
    padding: 10px 20px;
    background: linear-gradient(135deg, #28a745 0%, #218838 100%);
    color: white;
    text-decoration: none;
    border-radius: 8px;
    font-weight: bold;
    font-size: 15px;
    box-shadow: 0 4px 6px rgba(40, 167, 69, 0.2);
    transition: all 0.3s ease;
    border: none;
    cursor: pointer;
}

.btn-add:hover {
    box-shadow: 0 6px 12px rgba(40, 167, 69, 0.3);
    transform: translateY(-2px);
    color: white; /* Giữ màu chữ trắng khi hover */
}

/* Thêm icon điểm xuyết (Tùy chọn) */
.btn-add::before {
    content: "➕ ";
    font-size: 14px;
}
    /* Style chung cho các nút trong bảng */
.btn-action {
    display: inline-block;
    padding: 5px 12px;
    border-radius: 6px;
    text-decoration: none;
    font-size: 13px;
    font-weight: 600;
    transition: all 0.2s ease;
    margin: 2px;
}

/* Nút Sửa - Màu vàng cam (Warning) */
.btn-edit {
    background-color: #fff4e5;
    color: #ff9800;
    border: 1px solid #ff9800;
}

.btn-edit:hover {
    background-color: #ff9800;
    color: white;
    box-shadow: 0 2px 5px rgba(255, 152, 0, 0.3);
}

/* Nút Xóa - Màu đỏ nhạt (Danger) */
.btn-delete {
    background-color: #ffebee;
    color: #f44336;
    border: 1px solid #f44336;
}

.btn-delete:hover {
    background-color: #f44336;
    color: white;
    box-shadow: 0 2px 5px rgba(244, 67, 54, 0.3);
}
</style>

<body>

<div class="navbar">
    <a th:href="@{/products}">Trang chủ</a>

    <div class="dropdown">
        <button class="dropbtn">Sản phẩm ▾</button>
        <div class="dropdown-content">
            <a th:href="@{/products}">Tất cả sản phẩm</a>
            <hr style="margin: 0; border: 0.5px solid #eee;">
            <th:block>
                <a th:href="@{/product-types}"> Danh mục</a>
            </th:block>
        </div>
    </div>
</div>

<div style="padding: 20px;">
    <h2>Quản lý loại</h2>

    <a th:href="@{/product-types/new}" class="btn btn-add">Tạo mới</a>
</div>
<div th:if="${message}" style="color: #155724; background-color: #d4edda; padding: 10px; margin-bottom: 20px; border-radius: 5px;">
    [[${message}]]
</div>

<div th:if="${error}" style="color: #721c24; background-color: #f8d7da; padding: 10px; margin-bottom: 20px; border-radius: 5px;">
    [[${error}]]
</div>
    <table>
        <thead>
        <tr>
            <th>Tên loại</th>
            <th>Trạng thái</th>
            <th>Hành động</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="pt : ${listProductTypes}">
            <td th:text="${pt.typeName}" style="font-weight: bold;"></td>
            <td>
                <span th:if="${pt.isActive == 1}" class="badge badge-success">Hoạt động</span>
                <span th:if="${pt.isActive != 1}" class="badge badge-danger">Ngưng</span>
            </td>
            <td>
                <a th:href="@{'/product-types/edit/' + ${pt.id}}" class="btn-action btn-edit">
                    ✏️ Sửa
                </a>

                <a th:href="@{'/product-types/delete/' + ${pt.id}}"
                   class="btn-action btn-delete"
                   onclick="return confirm('Bạn có chắc chắn muốn xóa loại sản phẩm này không? Tất cả dữ liệu liên quan sẽ bị mất!')">
                    🗑️ Xóa
                </a>
            </td>
        </tr>
        </tbody>
    </table>
</div>

</body>
</html>
